services:

  postgres:
    image: postgis/postgis:17-3.5
    container_name: toll_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: tollmap
      POSTGRES_USER: tollapp
      POSTGRES_PASSWORD: tollapp_dev_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
